// ---------- Utilidades ----------
const limitar = (v, min, max) => Math.max(min, Math.min(max, v));
const distancia = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const menosMovimiento = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function mezclar(lista, azar) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(azar() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

// Convierte '#rrggbb' en [r, g, b]
function rgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function conAlfa(hex, alfa) {
  const [r, g, b] = rgb(hex);
  return `rgba(${r}, ${g}, ${b}, ${alfa})`;
}
// Mezcla dos colores: t = 0 → color a, t = 1 → color b
function mezclarColor(a, b, t) {
  const x = rgb(a), y = rgb(b);
  return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(', ')})`;
}


/* =====================================================================
   GEOMETRÍA (distancias entre puntos y tramos del pasillo)
   ===================================================================== */
function distPuntoSegmento(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const largo2 = dx * dx + dy * dy;
  let t = largo2 ? ((px - ax) * dx + (py - ay) * dy) / largo2 : 0;
  t = limitar(t, 0, 1);
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}

// ¿Se cruzan los tramos a-b y c-d? (puntos como [x, y])
function seCruzan(a, b, c, d) {
  const lado = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
  return lado(a, b, c) * lado(a, b, d) < 0 && lado(c, d, a) * lado(c, d, b) < 0;
}
function distSegmentos(a, b, c, d) {
  if (seCruzan(a, b, c, d)) return 0;
  return Math.min(
    distPuntoSegmento(a[0], a[1], c[0], c[1], d[0], d[1]),
    distPuntoSegmento(b[0], b[1], c[0], c[1], d[0], d[1]),
    distPuntoSegmento(c[0], c[1], a[0], a[1], b[0], b[1]),
    distPuntoSegmento(d[0], d[1], a[0], a[1], b[0], b[1]));
}
function distAPuntos(p, P) {   // distancia de [x, y] a una lista de puntos [[x, y], ...] unidos
  let min = Infinity;
  for (let i = 0; i < P.length - 1; i++) min = Math.min(min, distPuntoSegmento(p[0], p[1], P[i][0], P[i][1], P[i + 1][0], P[i + 1][1]));
  return min;
}
function largoCamino(P) {
  let total = 0;
  for (let i = 0; i < P.length - 1; i++) total += Math.hypot(P[i + 1][0] - P[i][0], P[i + 1][1] - P[i][1]);
  return total;
}
// Distancia (en px) desde (x, y) hasta la línea central del nivel actual
function distanciaAlCentro(x, y) {
  let min = Infinity;
  for (let i = 0; i < polilinea.length - 1; i++) {
    const a = polilinea[i], b = polilinea[i + 1];
    min = Math.min(min, distPuntoSegmento(x, y, a.x, a.y, b.x, b.y));
  }
  return min;
}


/* =====================================================================
   REVISIÓN DE NIVELES — revisa que un nivel cumpla las reglas.
   La usa la guía (MOSTRAR_GUIA) y el generador del modo infinito.
   Todo se mide en celdas.
   ===================================================================== */
function revisarObstaculo(nivel, o, k) {
  const P = nivel.puntos, h = nivel.ancho / 2;
  const R = CONFIG.RADIO_INICIO_META / CELDA, rj = CONFIG.RADIO_JUGADOR / CELDA;
  const nombre = `Obstáculo ${k + 1}`;
  const problemas = [];
  if (!(o.periodo >= 0.5)) problemas.push(`${nombre}: el periodo debe ser de al menos 0.5 segundos.`);
  // ¿Qué tramos del pasillo alcanza a tocar? Debe ser uno solo (o sus vecinos).
  const tocados = [];
  for (let i = 0; i < P.length - 1; i++) if (distSegmentos(o.desde, o.hasta, P[i], P[i + 1]) < o.radio + h) tocados.push(i);
  if (!tocados.length) problemas.push(`${nombre}: nunca cruza el pasillo.`);
  else if (tocados[tocados.length - 1] - tocados[0] > 2) problemas.push(`${nombre}: alcanza dos partes distintas del pasillo.`);
  // En cada extremo debe dejar libre el centro del pasillo
  for (const e of [o.desde, o.hasta]) {
    if (distAPuntos(e, P) < o.radio + rj + 0.1) problemas.push(`${nombre}: en [${e}] sigue tapando el centro del pasillo (llévalo más adentro de la pared).`);
    if (e[0] + 0.5 - o.radio < 0 || e[0] + 0.5 + o.radio > COLUMNAS || e[1] + 0.5 - o.radio < 0 || e[1] + 0.5 + o.radio > FILAS) {
      problemas.push(`${nombre}: en [${e}] se sale del tablero.`);
    }
  }
  const lejos = R + o.radio + CONFIG.MARGEN_PARED;
  const [ini, meta] = [P[0], P[P.length - 1]];
  if (distPuntoSegmento(ini[0], ini[1], o.desde[0], o.desde[1], o.hasta[0], o.hasta[1]) < lejos) problemas.push(`${nombre}: está muy cerca de INICIO.`);
  if (distPuntoSegmento(meta[0], meta[1], o.desde[0], o.desde[1], o.hasta[0], o.hasta[1]) < lejos) problemas.push(`${nombre}: está muy cerca de la META.`);
  return problemas;
}

function validarNivel(nivel) {
  const P = nivel.puntos || [];
  const h = nivel.ancho / 2;
  const R = CONFIG.RADIO_INICIO_META / CELDA, rj = CONFIG.RADIO_JUGADOR / CELDA;
  const M = CONFIG.MARGEN_PARED;
  const problemas = [];
  if (P.length < 2) return { ok: false, problemas: ['El nivel necesita al menos 2 puntos.'], largo: 0, velocidad: 0, velocidadConObstaculos: 0 };
  P.forEach((p, i) => {
    if (p[0] < 1 || p[0] > COLUMNAS - 2 || p[1] < 1 || p[1] > FILAS - 2) problemas.push(`El punto ${i + 1} [${p}] está en la orilla (usa x de 1 a 14 e y de 1 a 8).`);
  });
  if (h <= rj) problemas.push('El pasillo es más angosto que el jugador: sube "ancho".');
  // Tramos que no van seguidos: debe haber pared entre ellos
  for (let i = 0; i < P.length - 1; i++) {
    if (P[i][0] === P[i + 1][0] && P[i][1] === P[i + 1][1]) problemas.push(`Los puntos ${i + 1} y ${i + 2} son iguales.`);
    for (let j = i + 2; j < P.length - 1; j++) {
      const d = distSegmentos(P[i], P[i + 1], P[j], P[j + 1]);
      if (d < nivel.ancho + M) problemas.push(`Los tramos ${i + 1} y ${j + 1} están muy pegados: ${d.toFixed(2)} celdas (mínimo ${(nivel.ancho + M).toFixed(2)}).`);
    }
  }
  // INICIO y META no pueden quedar pegados a otra parte del pasillo
  const minimo = R + h + M;
  const ini = P[0], meta = P[P.length - 1];
  for (let i = 0; i < P.length - 1; i++) {
    if (i < P.length - 2 && distPuntoSegmento(meta[0], meta[1], P[i][0], P[i][1], P[i + 1][0], P[i + 1][1]) < minimo) problemas.push(`La META está muy cerca del tramo ${i + 1}.`);
    if (i > 0 && distPuntoSegmento(ini[0], ini[1], P[i][0], P[i][1], P[i + 1][0], P[i + 1][1]) < minimo) problemas.push(`INICIO está muy cerca del tramo ${i + 1}.`);
  }
  (nivel.obstaculos || []).forEach((o, k) => problemas.push(...revisarObstaculo(nivel, o, k)));
  // Velocidad promedio que necesita el jugador para llegar antes de que lo aplasten
  const largo = largoCamino(P) * CELDA;
  const tiempoUtil = nivel.tiempo * (1 - rj / h);
  const espera = (nivel.obstaculos || []).reduce((s, o) => s + o.periodo / 2, 0);
  return {
    ok: problemas.length === 0,
    problemas,
    largo,
    velocidad: largo / tiempoUtil,
    velocidadConObstaculos: tiempoUtil > espera ? largo / (tiempoUtil - espera) : Infinity,
  };
}


/* =====================================================================
   MODO INFINITO — crea niveles al azar (ver 🔧 INFINITO)
   ===================================================================== */
// Camino al azar que nunca se pisa a sí mismo, en saltos de 2 celdas
function caminataAlAzar(tramos, azar) {
  const columnas = [], filas = [];
  for (let x = 1 + Math.floor(azar() * 2); x <= COLUMNAS - 2; x += 2) columnas.push(x);
  for (let y = 1 + Math.floor(azar() * 2); y <= FILAS - 2; y += 2) filas.push(y);
  const visitado = new Set(), camino = [];
  let presupuesto = 4000;
  const DIRECCIONES = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function buscar(i, j) {
    camino.push([i, j]);
    visitado.add(i + ',' + j);
    if (camino.length === tramos + 1) return true;
    if (--presupuesto > 0) {
      for (const [di, dj] of mezclar(DIRECCIONES.slice(), azar)) {
        const ni = i + di, nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= columnas.length || nj >= filas.length || visitado.has(ni + ',' + nj)) continue;
        if (buscar(ni, nj)) return true;
        if (presupuesto <= 0) break;
      }
    }
    camino.pop();
    visitado.delete(i + ',' + j);
    return false;
  }
  const ok = buscar(Math.floor(azar() * columnas.length), Math.floor(azar() * filas.length));
  return ok ? camino.map(([i, j]) => [columnas[i], filas[j]]) : null;
}

// Junta los tramos que siguen en línea recta (quedan sólo los puntos donde dobla)
function unirRectas(camino) {
  const r = [camino[0]];
  for (let k = 1; k < camino.length - 1; k++) {
    const a = r[r.length - 1], b = camino[k], c = camino[k + 1];
    if ((b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]) !== 0) r.push(b);
  }
  r.push(camino[camino.length - 1]);
  return r;
}

function ponerObstaculosAlAzar(nivel, camino, cuantos, azar) {
  const candidatos = [];
  for (let k = 0; k < camino.length - 1; k++) {
    const a = camino[k], b = camino[k + 1];
    const dir = [(b[0] - a[0]) / 2, (b[1] - a[1]) / 2];
    candidatos.push({ centro: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], dir });
    const z = camino[k - 1];
    if (z && (a[0] - z[0]) * (b[1] - a[1]) - (a[1] - z[1]) * (b[0] - a[0]) === 0) candidatos.push({ centro: a.slice(), dir });
  }
  const radio = INFINITO.OBSTACULO_RADIO;
  const alejar = nivel.ancho / 2 + radio + INFINITO.HUNDIR_SIERRA;   // los extremos quedan metidos en la pared
  const redondo = (v) => Math.round(v * 100) / 100;
  for (const cand of mezclar(candidatos, azar)) {
    if (nivel.obstaculos.length >= cuantos) break;
    const lado = azar() < 0.5 ? 1 : -1;
    const n = [-cand.dir[1] * lado, cand.dir[0] * lado];
    const o = {
      desde: [redondo(cand.centro[0] - n[0] * alejar), redondo(cand.centro[1] - n[1] * alejar)],
      hasta: [redondo(cand.centro[0] + n[0] * alejar), redondo(cand.centro[1] + n[1] * alejar)],
      radio,
      periodo: redondo(INFINITO.PERIODO_MIN + azar() * (INFINITO.PERIODO_MAX - INFINITO.PERIODO_MIN)),
    };
    if (revisarObstaculo(nivel, o, 0).length) continue;
    const muyCerca = nivel.obstaculos.some((q) =>
      Math.hypot((q.desde[0] + q.hasta[0]) / 2 - cand.centro[0], (q.desde[1] + q.hasta[1]) / 2 - cand.centro[1]) < INFINITO.SEPARACION_SIERRAS);
    if (!muyCerca) nivel.obstaculos.push(o);
  }
}

// Segundos que necesita el nivel para que haya que ir a "velocidad" px/s
// (contando la espera de las sierras y lo que se achica el pasillo)
function calcularTiempo(nivel, velocidad) {
  const factor = 1 - (CONFIG.RADIO_JUGADOR / CELDA) / (nivel.ancho / 2);
  const espera = nivel.obstaculos.reduce((s, o) => s + o.periodo / 2, 0);
  const necesario = (largoCamino(nivel.puntos) * CELDA / velocidad + espera) / factor;
  return Math.max(INFINITO.TIEMPO_MINIMO, Math.ceil(necesario * 2) / 2);   // redondeado a medio segundo
}

// Crea el nivel infinito número n (1, 2, 3...). "azar" se puede cambiar para pruebas.
function generarNivelInfinito(n, azar = Math.random) {
  const I = INFINITO;
  const anchoTope = 2 - CONFIG.MARGEN_PARED - 0.1;   // más ancho no cabe: los caminos van separados por 2 celdas
  const ancho = Math.round(Math.min(anchoTope, Math.max(I.ANCHO_MINIMO, I.ANCHO_INICIAL - (n - 1) * I.ANCHO_POR_NIVEL)) * 100) / 100;
  const velocidad = Math.min(I.VELOCIDAD_MAX, I.VELOCIDAD_INICIAL + (n - 1) * I.VELOCIDAD_POR_NIVEL);
  const tramos = Math.min(I.TRAMOS_MAX, I.TRAMOS_INICIALES + Math.floor((n - 1) * I.TRAMOS_POR_NIVEL));
  const cuantos = n >= I.OBSTACULOS_DESDE
    ? Math.min(I.OBSTACULOS_MAX, 1 + Math.floor((n - I.OBSTACULOS_DESDE) / I.OBSTACULOS_CADA)) : 0;
  const nombre = TEXTOS.NOMBRE_INFINITO(n);
  for (let intento = 0; intento < I.INTENTOS; intento++) {
    const camino = caminataAlAzar(tramos, azar);
    if (!camino) continue;
    const nivel = { nombre, puntos: unirRectas(camino), ancho, tiempo: 0, obstaculos: [] };
    ponerObstaculosAlAzar(nivel, camino, cuantos, azar);
    nivel.tiempo = calcularTiempo(nivel, velocidad);
    if (validarNivel(nivel).ok) return nivel;
  }
  // Si nada funcionó: nivel de respaldo (siempre válido)
  const respaldo = { nombre, puntos: NIVEL_RESPALDO.map((p) => p.slice()), ancho, tiempo: 0, obstaculos: [] };
  respaldo.tiempo = calcularTiempo(respaldo, velocidad);
  return respaldo;
}


/* =====================================================================
   CARGAR UN NIVEL
   ===================================================================== */
function datosDelNivel(n) {
  if (n <= NIVELES.length) return NIVELES[n - 1];
  const k = n - NIVELES.length;
  if (!nivelesInfinitos[k]) nivelesInfinitos[k] = generarNivelInfinito(k);
  return nivelesInfinitos[k];
}

// Pasa un punto [x, y] en celdas a px. En vertical se "da vuelta" el nivel (x ↔ y).
function aPx(c) {
  const x = vertical ? c[1] : c[0], y = vertical ? c[0] : c[1];
  return { x: (x + 0.5) * CELDA, y: (y + 0.5) * CELDA };
}

function decidirOrientacion() {
  const zona = elZona.getBoundingClientRect();
  vertical = zona.width > 0 && zona.width < zona.height;
  W = (vertical ? FILAS : COLUMNAS) * CELDA;
  H = (vertical ? COLUMNAS : FILAS) * CELDA;
}

// Deja el nivel n listo para dibujar (sin cambiar el estado del juego)
function prepararNivel(n) {
  nivelActual = n;
  datosNivel = datosDelNivel(n);
  revision = validarNivel(datosNivel);
  decidirOrientacion();
  polilinea = datosNivel.puntos.map(aPx);
  inicioPx = polilinea[0];
  metaPx = polilinea[polilinea.length - 1];
  obstaculos = (datosNivel.obstaculos || []).map((o) => ({
    desde: aPx(o.desde), hasta: aPx(o.hasta), r: o.radio * CELDA, periodo: o.periodo,
  }));
  medioAnchoInicial = medioAncho = (datosNivel.ancho * CELDA) / 2;
  tiempoNivel = 0;
  actualizarObstaculos();
  ultimaPos = ultimaSegura = puntoRegreso = puntoGolpe = null;
  salioDelInicio = false;
  ajustarTamano();
  if (CONFIG.MOSTRAR_GUIA && !revision.ok) console.warn(`Nivel ${n} (${datosNivel.nombre}):\n` + revision.problemas.join('\n'));
}

// Nivel listo y esperando que el jugador ponga el cursor en INICIO
function cargarNivel(n) {
  prepararNivel(n);
  estado = 'esperando';
  elCaja.classList.add('sin-cursor');
  anunciar(TEXTOS.ANUNCIO_NIVEL(n, datosNivel.nombre));
  if (n === NIVELES.length + 1) avisar(TEXTOS.AVISO_INFINITO);
}

// Calcula el tamaño del tablero para que quepa en la pantalla sin tener que bajar
function ajustarTamano() {
  const zona = elZona.getBoundingClientRect();
  if (!zona.width || !zona.height) return;
  escalaCss = Math.min(zona.width / W, zona.height / H);
  const anchoCss = Math.max(1, Math.floor(W * escalaCss));
  const altoCss = Math.max(1, Math.floor(H * escalaCss));
  elCaja.style.width = anchoCss + 'px';
  elCaja.style.height = altoCss + 'px';
  // El canvas tiene más píxeles reales en pantallas nítidas (devicePixelRatio)
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const anchoReal = Math.round(anchoCss * dpr), altoReal = Math.round(altoCss * dpr);
  if (lienzo.width !== anchoReal) lienzo.width = anchoReal;
  if (lienzo.height !== altoReal) lienzo.height = altoReal;
  const clave = `${anchoReal}x${altoReal}x${W}`;
  if (clave !== claveParedes) { claveParedes = clave; prepararParedes(); }
}

// La ventana cambió de tamaño (girar el celular, maximizar, zoom del navegador...)
function alCambiarTamano() {
  const zona = elZona.getBoundingClientRect();
  if (!zona.width || !zona.height) return;
  // Si estabas jugando, el tablero se movió debajo del cursor o del dedo: mejor pausar
  // (si no, el siguiente movimiento "saltaría" atravesando paredes)
  if (estado === 'jugando') { puntero.visible = false; pausar(); }
  const antes = vertical;
  decidirOrientacion();
  if (vertical !== antes) {
    if (['inicio', 'esperando', 'gameOver', 'victoria'].includes(estado)) { prepararNivel(nivelActual); return; }   // no ha empezado: se carga de nuevo
    transponerNivel();   // en pausa (o en un mensaje): se da vuelta lo que hay, sin perder nada
  }
  ajustarTamano();
}

// Da vuelta el nivel que se está jugando (x ↔ y), por ejemplo si giras el celular en la pausa
function transponerNivel() {
  const t = (p) => (p ? { x: p.y, y: p.x } : p);
  polilinea = polilinea.map(t);
  inicioPx = polilinea[0];
  metaPx = polilinea[polilinea.length - 1];
  obstaculos = obstaculos.map((o) => ({ ...o, desde: t(o.desde), hasta: t(o.hasta) }));
  actualizarObstaculos();
  ultimaPos = t(ultimaPos); ultimaSegura = t(ultimaSegura); puntoRegreso = t(puntoRegreso); puntoGolpe = t(puntoGolpe);
  particulas.forEach((p) => { [p.x, p.y, p.vx, p.vy] = [p.y, p.x, p.vy, p.vx]; });
}


/* =====================================================================
   MOUSE Y DEDO
   ===================================================================== */
// Convierte la posición en la pantalla a px del tablero
function aLogico(clienteX, clienteY) {
  const r = lienzo.getBoundingClientRect();
  return { x: ((clienteX - r.left) * W) / r.width, y: ((clienteY - r.top) * H) / r.height };
}
const esTactil = () => puntero.tipo === 'touch';
// Antes de tocar nada: si la pantalla es táctil, se asume dedo
function tipoPunteroInicial() {
  try { return window.matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse'; } catch { return 'mouse'; }
}
// Cualquier clic o toque en la página: recuerda si es mouse o dedo y deja listo el sonido
function alTocarPagina(e) {
  if (e.pointerType) puntero.tipo = e.pointerType;
  prepararAudio();
}

// Radio (en px del tablero) en que se acepta un toque con el dedo: nunca menos que CONFIG.TOQUE_MINIMO px de pantalla
const radioToque = (r) => Math.max(r, CONFIG.TOQUE_MINIMO / escalaCss);
// Radio del punto de regreso: con el dedo es más grande (más fácil de tocar)
const radioRegresoActual = () => (esTactil() ? radioToque(radioRegreso()) : radioRegreso());

function alMoverPuntero(e) {
  if (!e.isPrimary) return;
  puntero.tipo = e.pointerType || 'mouse';
  if (!esTactil()) desfase.x = desfase.y = 0;
  // Los navegadores juntan varios movimientos en uno: los revisamos todos
  const juntos = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [];
  for (const ev of juntos.length ? juntos : [e]) {
    const q = aLogico(ev.clientX, ev.clientY);
    const p = { x: q.x + desfase.x, y: q.y + desfase.y };
    puntero.x = p.x; puntero.y = p.y; puntero.visible = true;
    procesarPosicion(p, false);
  }
}
function alBajarPuntero(e) {
  if (!e.isPrimary) return;
  puntero.tipo = e.pointerType || 'mouse';
  desfase.x = desfase.y = 0;
  const q = aLogico(e.clientX, e.clientY);
  // Toque "generoso" con el dedo: si cae cerca de INICIO (o del punto de regreso en la pausa),
  // el punto parte en el centro del círculo y desde ahí sigue al dedo mientras no lo levantes.
  if (esTactil()) {
    const R = CONFIG.RADIO_INICIO_META;
    let centro = null;
    if (estado === 'esperando' && distancia(q, inicioPx) > R && distancia(q, inicioPx) <= radioToque(R)) centro = inicioPx;
    if (estado === 'pausa' && distancia(q, puntoRegreso) <= radioRegresoActual()) centro = puntoRegreso;
    if (centro) { desfase.x = centro.x - q.x; desfase.y = centro.y - q.y; }
  }
  const p = { x: q.x + desfase.x, y: q.y + desfase.y };
  puntero.x = p.x; puntero.y = p.y; puntero.visible = true;
  procesarPosicion(p, true);
}
function alSoltarPuntero(e) {
  if (!e.isPrimary || e.pointerType === 'mouse') return;   // con mouse, soltar el botón no importa
  puntero.visible = false;
  desfase.x = desfase.y = 0;
  if (estado !== 'jugando') return;
  // Si levantaste el dedo sin salir de INICIO (por ejemplo, un toque), el nivel vuelve a esperar: no hay pausa
  if (!salioDelInicio) volverAEsperar();
  else pausar();
}
function alSalirPuntero(e) {
  if (!e.isPrimary) return;
  puntero.visible = false;
  if (estado === 'jugando') pausar();
}

// Atajos de teclado (con mouse no hay que mover el cursor para silenciar o pausar)
// 🔧 Para cambiar las teclas, cambia las letras de aquí (y el texto TEXTOS.ATAJOS).
function alPresionarTecla(e) {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;   // Ctrl+P es imprimir: no lo tocamos
  const tecla = e.key.toLowerCase();
  if (tecla === 'm') alternarSonido();
  else if ((tecla === 'p' || tecla === 'escape') && estado === 'jugando') pausar(true);
}

// Qué pasa cuando el jugador se mueve a "p", según el estado del juego.
// "alBajar" = true si fue un clic o un toque (no sólo mover).
function procesarPosicion(p, alBajar) {
  if (estado === 'esperando') {
    if (distancia(p, inicioPx) <= CONFIG.RADIO_INICIO_META) empezarNivel(p);
  } else if (estado === 'jugando') {
    recorrer(ultimaPos, p);
  } else if (estado === 'pausa') {
    // Se sigue al volver al punto de regreso. Con el dedo: sólo al TOCAR el círculo (pasar el dedo encima no cuenta).
    // Con el mouse: al pasar encima (si antes saliste del círculo) o al hacer clic en él.
    const dentro = distancia(p, puntoRegreso) <= radioRegresoActual() && evaluarPunto(p.x, p.y) === 'ok';
    if (!dentro) regresoArmado = true;
    else if (alBajar || (!esTactil() && regresoArmado)) reanudar(p);
  }
}


/* =====================================================================
   REGLAS DEL JUEGO
   ===================================================================== */
// Parte del pasillo que queda: 1 = entero, 0 = te aplasta
function fraccionUtil() {
  const rj = CONFIG.RADIO_JUGADOR;
  return limitar((medioAncho - rj) / (medioAnchoInicial - rj), 0, 1);
}
function curvaCierre(p) {
  if (CONFIG.CURVA_CIERRE === 'acelerando') return p * p;
  if (CONFIG.CURVA_CIERRE === 'frenando') return 1 - (1 - p) * (1 - p);
  return p;
}
function posicionObstaculo(o, t) {
  const s = (1 - Math.cos((2 * Math.PI * t) / o.periodo)) / 2;   // va de 0 a 1 y vuelve, suavecito
  return { x: o.desde.x + (o.hasta.x - o.desde.x) * s, y: o.desde.y + (o.hasta.y - o.desde.y) * s, r: o.r };
}
function actualizarObstaculos() {
  obstaculosAhora = obstaculos.map((o) => posicionObstaculo(o, tiempoNivel));
}
const radioRegreso = () => Math.max(CONFIG.RADIO_REGRESO, 2.5 * CONFIG.RADIO_JUGADOR);

// Revisa un punto: 'ok' | 'meta' | 'pared' | 'obstaculo' | 'aplastado'
function evaluarPunto(x, y) {
  const rj = CONFIG.RADIO_JUGADOR, R = CONFIG.RADIO_INICIO_META;
  if (medioAncho - rj < 0) return 'aplastado';
  if (Math.hypot(x - metaPx.x, y - metaPx.y) <= R) return 'meta';
  for (const o of obstaculosAhora) if (Math.hypot(x - o.x, y - o.y) < o.r + rj) return 'obstaculo';
  if (Math.hypot(x - inicioPx.x, y - inicioPx.y) <= R) return 'ok';   // INICIO es zona segura
  if (distanciaAlCentro(x, y) <= medioAncho - rj) return 'ok';
  return 'pared';
}

// Revisa TODO el camino entre dos posiciones, cada 2 px: un movimiento rápido no atraviesa paredes
function recorrer(a, b) {
  const pasos = Math.max(1, Math.ceil(distancia(a, b) / CONFIG.PASO_COLISION));
  for (let i = 1; i <= pasos; i++) {
    const x = a.x + ((b.x - a.x) * i) / pasos, y = a.y + ((b.y - a.y) * i) / pasos;
    const resultado = evaluarPunto(x, y);
    if (resultado === 'ok') {
      ultimaSegura = { x, y };
      if (!salioDelInicio && Math.hypot(x - inicioPx.x, y - inicioPx.y) > CONFIG.RADIO_INICIO_META) salioDelInicio = true;
      continue;
    }
    ultimaPos = { x, y };
    resolver(resultado, x, y);
    return;
  }
  ultimaPos = { x: b.x, y: b.y };
}
function resolver(resultado, x, y) {
  if (resultado === 'meta') completarNivel();
  else if (resultado !== 'ok') perderVida(resultado, x, y);
}

function empezarNivel(p) {
  estado = 'jugando';
  tiempoNivel = 0;
  ultimaPos = { x: p.x, y: p.y };
  ultimaSegura = { x: p.x, y: p.y };
  salioDelInicio = false;
  sonar(SONIDOS.INICIO);
  anunciar(TEXTOS.ANUNCIO_EMPEZO);
}

// El nivel vuelve a esperar en INICIO con el pasillo entero (se usa si levantas el dedo sin salir de INICIO)
function volverAEsperar() {
  estado = 'esperando';
  tiempoNivel = 0;
  medioAncho = medioAnchoInicial;
  actualizarObstaculos();
  ultimaPos = ultimaSegura = null;
}

// Corre cada cuadro mientras se juega: achica el pasillo, mueve sierras y revisa choques
function avanzarJuego(dt, ahora) {
  tiempoNivel += dt;
  medioAncho = medioAnchoInicial * (1 - curvaCierre(Math.min(1, tiempoNivel / datosNivel.tiempo)));
  actualizarObstaculos();
  // Aunque el cursor esté quieto, las paredes y sierras se mueven: hay que revisar igual.
  // Si aquí da "pared" es porque la pared se cerró encima del jugador quieto: eso es "aplastado".
  const resultado = evaluarPunto(ultimaPos.x, ultimaPos.y);
  if (resultado === 'ok') ultimaSegura = { x: ultimaPos.x, y: ultimaPos.y };
  else { resolver(resultado === 'pared' ? 'aplastado' : resultado, ultimaPos.x, ultimaPos.y); return; }
  // Tic-tac cada vez más rápido cuando queda poco pasillo
  const f = fraccionUtil();
  if (f < CONFIG.PELIGRO) {
    const intervalo = SONIDOS.TICK_LENTO + (SONIDOS.TICK_RAPIDO - SONIDOS.TICK_LENTO) * (1 - f / CONFIG.PELIGRO);
    if (ahora - ultimoTick >= intervalo) { ultimoTick = ahora; sonar(SONIDOS.TICK); }
  }
}

// PAUSA: se congela todo y hay que volver al "punto de regreso".
// conTecla = true si se pausó con P o Esc (ver alPresionarTecla)
function pausar(conTecla = false) {
  if (estado !== 'jugando') return;
  estado = 'pausa';
  puntoRegreso = { x: ultimaSegura.x, y: ultimaSegura.y };
  // Pausa con tecla y el cursor sigue encima del punto: primero tiene que salir del círculo y
  // volver (o hacer clic en él). Así puedes ir al botón 🔊 sin que el juego siga solo.
  regresoArmado = !(conTecla === true && puntero.visible && distancia(puntero, puntoRegreso) <= radioRegresoActual());
  anunciar(TEXTOS.ANUNCIO_PAUSA);
}
function reanudar(p) {
  if (estado !== 'pausa') return;
  estado = 'jugando';
  ultimaPos = { x: p.x, y: p.y };    // se sigue desde aquí (no desde donde salió el cursor)
  ultimaSegura = { x: p.x, y: p.y };
  anunciar(TEXTOS.ANUNCIO_SIGUE);
}

function programar(funcion, ms) {
  clearTimeout(temporizador);
  temporizador = setTimeout(funcion, ms);
}

// Llegaste a la META
function completarNivel() {
  if (estado !== 'jugando') return;
  estado = 'nivelSuperado';
  const fraccion = fraccionUtil();
  const ganados = CONFIG.PUNTOS_POR_NIVEL + Math.round(CONFIG.PUNTOS_BONUS_MAX * fraccion);
  puntos += ganados;
  lanzarConfeti(metaPx.x, metaPx.y);
  sonar(SONIDOS.NIVEL);
  $('nivelTitulo').textContent = TEXTOS.NIVEL_SUPERADO(nivelActual, ganados);
  $('nivelSub').textContent = TEXTOS.NIVEL_SOBRO(Math.round(fraccion * 100));
  const esElUltimo = nivelActual >= NIVELES.length && !CONFIG.MODO_INFINITO;   // lo que sigue es "¡Ganaste!"
  $('btnSiguiente').textContent = esElUltimo ? TEXTOS.BOTON_VER_FINAL : TEXTOS.BOTON_SIGUIENTE;
  mostrarPantalla('pantallaNivel');
  programar(siguienteNivel, CONFIG.TIEMPO_ENTRE_NIVELES);
}

function siguienteNivel() {
  if (estado !== 'nivelSuperado') return;     // evita que el botón y el reloj lo hagan dos veces
  clearTimeout(temporizador);
  const siguiente = nivelActual + 1;
  if (siguiente > NIVELES.length && !CONFIG.MODO_INFINITO) { terminarPartida(true); return; }
  ocultarPantallas();
  cargarNivel(siguiente);
}

// Perdiste una vida: 'pared' | 'aplastado' | 'obstaculo'
function perderVida(motivo, x, y) {
  if (estado !== 'jugando') return;           // nunca se pierden dos vidas de una vez
  estado = 'golpe';
  vidas = Math.max(0, vidas - 1);
  puntoGolpe = { x, y };
  lanzarChispas(x, y);
  sonar(SONIDOS.GOLPE);
  vibrar();
  sacudir();
  $('golpeTitulo').textContent = TEXTOS.GOLPE[motivo] || TEXTOS.GOLPE.pared;
  $('golpeSub').textContent = vidas > 0 ? TEXTOS.QUEDAN_VIDAS(vidas) : TEXTOS.SIN_VIDAS;
  mostrarPantalla('pantallaGolpe');
  programar(() => {
    if (estado !== 'golpe') return;
    if (vidas <= 0) terminarPartida(false);
    else { ocultarPantallas(); cargarNivel(nivelActual); }   // el MISMO nivel, con el pasillo entero
  }, CONFIG.TIEMPO_GOLPE);
}

// Fin de la partida: ganaste = true muestra la Victoria, false el "¡Fin del juego!"
function terminarPartida(ganaste) {
  clearTimeout(temporizador);
  estado = ganaste ? 'victoria' : 'gameOver';
  elCaja.classList.remove('sin-cursor');
  sonar(ganaste ? SONIDOS.NIVEL : SONIDOS.FIN);
  const nuevoRecord = puntos > 0 && puntos > record.puntos;
  record = { nivel: Math.max(record.nivel, nivelActual), puntos: Math.max(record.puntos, puntos) };
  guardarRecord(record);
  const rango = rangoPara(nivelActual);
  $('finTitulo').textContent = ganaste ? TEXTOS.VICTORIA_TITULO : TEXTOS.FIN_TITULO;
  $('finTexto').innerHTML = ganaste ? TEXTOS.VICTORIA_TEXTO(NIVELES.length) : TEXTOS.FIN_TEXTO(nivelActual);
  $('finPuntos').innerHTML = TEXTOS.FIN_PUNTOS(puntos);
  $('finRecord').hidden = !nuevoRecord;
  $('finRango').textContent = `${rango.emoji} ${rango.nombre}`;
  mostrarPantalla('pantallaFin');
  if (nuevoRecord || ganaste) lanzarConfeti(W / 2, H / 3, true);   // true = encima de la pantalla de fin
}

function rangoPara(nivel) {
  let elegido = RANGOS[0];
  RANGOS.forEach((r) => { if (nivel >= r.desde) elegido = r; });
  return elegido;
}

function empezarPartida(n) {
  clearTimeout(temporizador);
  vidas = CONFIG.VIDAS;
  puntos = 0;
  nivelesInfinitos = {};
  particulas = [];
  ocultarPantallas();
  cargarNivel(n);
}
function nuevaPartida() {
  if (!['inicio', 'gameOver', 'victoria'].includes(estado)) return;   // evita doble clic
  empezarPartida(nivelDePartida);
}
function irAlInicio() {
  if (!['gameOver', 'victoria'].includes(estado)) return;
  estado = 'inicio';
  vidas = CONFIG.VIDAS;      // el HUD de la pantalla de inicio no muestra la partida anterior
  puntos = 0;
  elCaja.classList.remove('sin-cursor');
  prepararNivel(nivelDePartida);
  actualizarTextoRecord();
  mostrarPantalla('pantallaInicio');
}


/* =====================================================================
   PANTALLAS, HUD Y AVISOS
   ===================================================================== */
function mostrarPantalla(id) {
  PANTALLAS.forEach((p) => { $(p).hidden = p !== id; });
  const pantalla = $(id);
  const principal = pantalla.querySelector('[data-principal]');
  if (principal) principal.focus({ preventScroll: true });
  anunciar(pantalla.innerText.replace(/\s+/g, ' ').trim());
}
function ocultarPantallas() {
  PANTALLAS.forEach((p) => { $(p).hidden = true; });
}

function anunciar(texto) {
  const el = $('anuncio');
  el.textContent = '';
  setTimeout(() => { el.textContent = texto; }, 40);
}

let temporizadorAviso = null;
function avisar(texto) {
  const aviso = $('aviso');
  aviso.textContent = texto;
  aviso.classList.add('visible');
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => aviso.classList.remove('visible'), CONFIG.TIEMPO_AVISO);
}

function ponerTexto(el, texto) { if (el.textContent !== texto) el.textContent = texto; }

// Se llama en cada cuadro, pero sólo cambia lo que cambió
function actualizarHud() {
  if (!datosNivel) return;
  ponerTexto($('hudNivelNum'), TEXTOS.HUD_NIVEL(nivelActual));
  ponerTexto($('hudNivelNombre'), datosNivel.nombre);
  ponerTexto($('hudVidas'), TEXTOS.CORAZON_LLENO.repeat(vidas) + TEXTOS.CORAZON_VACIO.repeat(Math.max(0, CONFIG.VIDAS - vidas)));
  const aria = TEXTOS.HUD_VIDAS_ARIA(vidas, CONFIG.VIDAS);
  if ($('hudVidas').getAttribute('aria-label') !== aria) $('hudVidas').setAttribute('aria-label', aria);
  ponerTexto($('hudPuntos'), TEXTOS.HUD_PUNTOS(puntos));
  const pct = Math.round(fraccionUtil() * 100);
  const porcentaje = pct + '%';
  if ($('hudPorcentaje').textContent !== porcentaje) {
    $('hudPorcentaje').textContent = porcentaje;
    $('hudBarra').style.width = porcentaje;
  }
  $('hudPasillo').classList.toggle('peligro', pct / 100 < CONFIG.PELIGRO);
}

function actualizarBotonesSonido() {
  $('btnSonido').textContent = silencio ? TEXTOS.SONIDO_ICONO_NO : TEXTOS.SONIDO_ICONO_SI;
  $('btnSonido').setAttribute('aria-label', silencio ? TEXTOS.SONIDO_ARIA_NO : TEXTOS.SONIDO_ARIA_SI);
  $('btnSonido').setAttribute('aria-pressed', String(!silencio));
  $('btnSonidoInicio').textContent = silencio ? TEXTOS.SONIDO_NO : TEXTOS.SONIDO_SI;
}
function actualizarTextoRecord() {
  $('textoRecord').textContent = record.nivel > 0 ? TEXTOS.RECORD(record.nivel, record.puntos) : TEXTOS.SIN_RECORD;
}

// Sacudón + destello rojo (no se hace si la persona pidió menos animaciones)
function sacudir() {
  if (menosMovimiento()) return;
  for (const [el, clase] of [[elJuego, 'temblando'], [$('destello'), 'activo']]) {
    el.classList.remove(clase);
    void el.offsetWidth;            // truco para que la animación vuelva a empezar
    el.classList.add(clase);
  }
}
function vibrar() {
  try {
    const permitido = !navigator.userActivation || navigator.userActivation.hasBeenActive;
    if (permitido && typeof navigator.vibrate === 'function') navigator.vibrate(CONFIG.TIEMPO_VIBRAR);
  } catch { /* sin vibración: no pasa nada */ }
}


/* =====================================================================
   SONIDO (sintetizador del navegador, ver 🔧 SONIDOS)
   ===================================================================== */
// El navegador sólo deja crear el audio después de un clic o toque
function prepararAudio() {
  try {
    if (!audio) {
      const ContextoAudio = window.AudioContext || window.webkitAudioContext;
      if (!ContextoAudio) return;
      audio = new ContextoAudio();
    }
    if (audio.state === 'suspended') audio.resume().catch(() => {});
  } catch { audio = null; }
}
function tono(t) {
  try {
    const inicio = audio.currentTime + (t.retraso || 0);
    const fin = inicio + t.duracion;
    const osc = audio.createOscillator();
    const ganancia = audio.createGain();
    osc.type = t.tipo || 'sine';
    osc.frequency.setValueAtTime(t.frecuencia, inicio);
    if (t.frecuenciaFinal) osc.frequency.exponentialRampToValueAtTime(t.frecuenciaFinal, fin);
    const volumen = Math.max(0.0001, CONFIG.VOLUMEN * (t.volumen ?? 1));
    ganancia.gain.setValueAtTime(0.0001, inicio);
    ganancia.gain.exponentialRampToValueAtTime(volumen, inicio + 0.008);
    ganancia.gain.exponentialRampToValueAtTime(0.0001, fin);
    osc.connect(ganancia);
    ganancia.connect(audio.destination);
    osc.start(inicio);
    osc.stop(fin + 0.03);
  } catch { /* sin sonido: no pasa nada */ }
}
function sonar(lista) {
  if (silencio || !audio || audio.state !== 'running') return;
  lista.forEach(tono);
}
function alternarSonido() {
  silencio = !silencio;
  guardarSilencio(silencio);
  actualizarBotonesSonido();
  if (!silencio) { prepararAudio(); sonar(SONIDOS.BOTON); }
}


/* =====================================================================
   MEMORIA DEL NAVEGADOR (récord y sonido)
   Si el navegador no deja guardar (modo incógnito, bloqueos), el juego
   funciona igual; sólo no recuerda nada.
   ===================================================================== */
function leerRecord() {
  try {
    const r = JSON.parse(localStorage.getItem(CONFIG.CLAVE_RECORD));
    if (r && Number.isFinite(r.nivel) && Number.isFinite(r.puntos)) return r;
  } catch { /* sin memoria */ }
  return { nivel: 0, puntos: 0 };
}
function guardarRecord(r) {
  try { localStorage.setItem(CONFIG.CLAVE_RECORD, JSON.stringify(r)); } catch { /* sin memoria: no pasa nada */ }
}
// 💡 IDEA: tabla de récords: guardar una lista con los 5 mejores { nombre, nivel, puntos, fecha }
//          en guardarRecord() y mostrarla en la pantalla de inicio.
function leerSilencio() {
  try {
    const v = localStorage.getItem(CONFIG.CLAVE_SONIDO);
    if (v === '1') return true;
    if (v === '0') return false;
  } catch { /* sin memoria */ }
  return !CONFIG.SONIDO;
}
function guardarSilencio(valor) {
  try { localStorage.setItem(CONFIG.CLAVE_SONIDO, valor ? '1' : '0'); } catch { /* sin memoria */ }
}


/* =====================================================================
   COMPARTIR
   ===================================================================== */
async function compartir() {
  const rango = rangoPara(nivelActual);
  const texto = TEXTOS.COMPARTIR_TEXTO(nivelActual, puntos, `${rango.emoji} ${rango.nombre}`);
  try {
    if (navigator.share) {
      await navigator.share({ title: TEXTOS.COMPARTIR_TITULO, text: texto, url: CONFIG.URL_COMPARTIR });
      return;
    }
    await navigator.clipboard.writeText(`${texto} ${CONFIG.URL_COMPARTIR}`);
    avisar(TEXTOS.AVISO_COPIADO);
  } catch (error) {
    if (error && error.name === 'AbortError') return;    // la persona cerró el menú de compartir
    try {
      await navigator.clipboard.writeText(`${texto} ${CONFIG.URL_COMPARTIR}`);
      avisar(TEXTOS.AVISO_COPIADO);
    } catch { avisar(TEXTOS.AVISO_ERROR_COMPARTIR); }
  }
}


/* =====================================================================
   🔧 DIBUJO — todo lo que se ve en el tablero
   Todo se dibuja en px "lógicos" (960 x 600, o 600 x 960 en vertical);
   el juego lo agranda o achica solo para que quepa en la pantalla.
   ===================================================================== */
// En pantallas chicas los textos del tablero se agrandan un poco para que se lean
const tamTexto = (base) => base * limitar(DIBUJO.TEXTO_MINIMO / escalaCss, 1, 1.7);

// Las paredes de ladrillo se dibujan una sola vez en un canvas aparte (más rápido)
function prepararParedes() {
  const capa = document.createElement('canvas');
  capa.width = lienzo.width;
  capa.height = lienzo.height;
  const c = capa.getContext('2d');
  c.setTransform(capa.width / W, 0, 0, capa.height / H, 0, 0);
  c.fillStyle = COLORES_JUEGO.pared;
  c.fillRect(0, 0, W, H);
  const a = DIBUJO.LADRILLO_ANCHO, b = DIBUJO.LADRILLO_ALTO;
  c.fillStyle = 'rgba(255, 255, 255, 0.05)';   // brillito arriba de cada ladrillo
  c.beginPath();
  for (let fila = 0; fila * b < H; fila++) {
    const desfase = (fila % 2) * (a / 2);
    for (let x = -desfase; x < W; x += a) c.rect(x + 2, fila * b + 2, a - 4, 3);
  }
  c.fill();
  c.strokeStyle = COLORES_JUEGO.paredJunta;
  c.lineWidth = 2;
  c.beginPath();
  for (let fila = 0; fila * b < H; fila++) {
    const y = fila * b, desfase = (fila % 2) * (a / 2);
    c.moveTo(0, y); c.lineTo(W, y);
    for (let x = -desfase; x < W; x += a) { c.moveTo(x, y); c.lineTo(x, y + b); }
  }
  c.stroke();
  fondoParedes = capa;
}

function trazarPolilinea(c) {
  c.beginPath();
  c.moveTo(polilinea[0].x, polilinea[0].y);
  for (let i = 1; i < polilinea.length; i++) c.lineTo(polilinea[i].x, polilinea[i].y);
}

// El pasillo: una línea gruesa con puntas y esquinas redondas.
// Lo que se ve es EXACTAMENTE la zona donde el punto no choca.
function dibujarPasillo(c, ahora) {
  const f = fraccionUtil();
  let colorBorde = mezclarColor(COLORES_JUEGO.borde, COLORES_JUEGO.bordePeligro, (1 - f) * 0.4);
  if (estado !== 'inicio' && f < CONFIG.PELIGRO) {
    // parpadea más rápido mientras más se cierra (con "menos animaciones" queda rojo fijo, sin parpadear)
    const rapidez = DIBUJO.PARPADEO_LENTO + (DIBUJO.PARPADEO_RAPIDO - DIBUJO.PARPADEO_LENTO) * (1 - f / CONFIG.PELIGRO);
    const latido = menosMovimiento() ? 1 : 0.5 + 0.5 * Math.sin((ahora / 1000) * rapidez);
    colorBorde = mezclarColor(COLORES_JUEGO.borde, COLORES_JUEGO.bordePeligro, 0.5 + 0.5 * latido);
  }
  c.save();
  c.lineJoin = 'round';
  c.lineCap = 'round';
  trazarPolilinea(c);
  c.strokeStyle = colorBorde;
  c.globalAlpha = 0.3;
  c.lineWidth = 2 * medioAncho + 2 * (DIBUJO.GROSOR_BORDE + DIBUJO.HALO_BORDE);
  c.stroke();
  c.globalAlpha = 1;
  c.lineWidth = 2 * medioAncho + 2 * DIBUJO.GROSOR_BORDE;
  c.stroke();
  if (medioAncho > 0.05) {
    c.strokeStyle = COLORES_JUEGO.suelo;
    c.lineWidth = 2 * medioAncho;
    c.stroke();
  }
  c.restore();
}

// Texto con contorno oscuro (para que se lea sobre cualquier fondo)
function etiqueta(c, texto, x, y, color, tam) {
  c.font = `${tamTexto(tam)}px "Bangers", ${FUENTE_EMOJI}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.lineWidth = 5;
  c.strokeStyle = conAlfa(COLORES_JUEGO.contorno, 0.85);
  c.strokeText(texto, x, y);
  c.fillStyle = color;
  c.fillText(texto, x, y);
}
// Altura de la etiqueta de un círculo: arriba del círculo (o abajo si no cabe)
function yEtiqueta(p) {
  const R = CONFIG.RADIO_INICIO_META, alto = tamTexto(DIBUJO.TAM_ETIQUETAS);
  return p.y - R - alto * 0.7 < 0 ? p.y + R + alto * 0.7 : p.y - R - alto * 0.7;
}
function etiquetaCirculo(c, texto, p, color) {
  etiqueta(c, texto, p.x, yEtiqueta(p), color, DIBUJO.TAM_ETIQUETAS);
}

function dibujarInicio(c, ahora) {
  const { x, y } = inicioPx, R = CONFIG.RADIO_INICIO_META;
  const latido = menosMovimiento() ? 0.5 : 0.5 + 0.5 * Math.sin((ahora / 1000) * Math.PI * 2 * DIBUJO.PULSO_INICIO);
  const brillo = c.createRadialGradient(x, y, R * 0.3, x, y, R * (1.5 + 0.4 * latido));
  brillo.addColorStop(0, conAlfa(COLORES_JUEGO.inicio, 0.45));
  brillo.addColorStop(1, conAlfa(COLORES_JUEGO.inicio, 0));
  c.fillStyle = brillo;
  c.beginPath(); c.arc(x, y, R * (1.5 + 0.4 * latido), 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(x, y, R, 0, Math.PI * 2);
  c.fillStyle = conAlfa(COLORES_JUEGO.inicio, 0.22 + 0.2 * latido);
  c.fill();
  c.lineWidth = 3;
  c.strokeStyle = COLORES_JUEGO.inicio;
  c.stroke();
  etiquetaCirculo(c, TEXTOS.ETIQUETA_INICIO, inicioPx, COLORES_JUEGO.inicio);
}

function dibujarMeta(c) {
  const { x, y } = metaPx, R = CONFIG.RADIO_INICIO_META;
  const oro = c.createRadialGradient(x - R * 0.3, y - R * 0.3, R * 0.1, x, y, R);
  oro.addColorStop(0, COLORES_JUEGO.meta);
  oro.addColorStop(1, COLORES_JUEGO.metaOscuro);
  c.beginPath(); c.arc(x, y, R, 0, Math.PI * 2);
  c.fillStyle = oro; c.fill();
  c.lineWidth = 3; c.strokeStyle = COLORES_JUEGO.metaAro; c.stroke();
  // Banderita a cuadros
  const palo = x - R * 0.3, arriba = y - R * 0.62, abajo = y + R * 0.62;
  c.strokeStyle = COLORES_JUEGO.banderaPalo; c.lineWidth = 2.5;
  c.beginPath(); c.moveTo(palo, abajo); c.lineTo(palo, arriba); c.stroke();
  const lado = (R * 0.8) / 3;
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 2; j++) {
      c.fillStyle = COLORES_JUEGO.banderaCuadros[(i + j) % 2];
      c.fillRect(palo + i * lado, arriba + j * lado, lado, lado);
    }
  }
  etiquetaCirculo(c, TEXTOS.ETIQUETA_META, metaPx, COLORES_JUEGO.meta);
}

// Sierra enojada. El círculo rojo suave es su tamaño real de choque.
function dibujarSierra(c, o, ahora) {
  const { x, y, r } = o;
  const giro = menosMovimiento() ? 0 : (ahora / 1000) * DIBUJO.GIRO_SIERRA;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
  c.fillStyle = conAlfa(COLORES_JUEGO.obstaculo, 0.2); c.fill();
  c.beginPath();
  const puntas = DIBUJO.PUNTAS_SIERRA * 2;
  for (let i = 0; i <= puntas; i++) {
    const radio = i % 2 ? r * 0.72 : r;
    const ang = giro + (i * Math.PI) / DIBUJO.PUNTAS_SIERRA;
    c.lineTo(x + Math.cos(ang) * radio, y + Math.sin(ang) * radio);
  }
  c.closePath();
  c.fillStyle = COLORES_JUEGO.obstaculo; c.fill();
  c.lineWidth = 2; c.strokeStyle = COLORES_JUEGO.obstaculoOscuro; c.stroke();
  c.beginPath(); c.arc(x, y, r * 0.55, 0, Math.PI * 2);
  c.fillStyle = COLORES_JUEGO.obstaculoOscuro; c.fill();
  // Ojos enojados (no giran)
  for (const lado of [-1, 1]) {
    c.beginPath(); c.arc(x + lado * r * 0.2, y - r * 0.02, r * 0.14, 0, Math.PI * 2);
    c.fillStyle = COLORES_JUEGO.sierraOjos; c.fill();
    c.beginPath(); c.arc(x + lado * r * 0.17, y + r * 0.02, r * 0.07, 0, Math.PI * 2);
    c.fillStyle = COLORES_JUEGO.sierraPupila; c.fill();
    c.beginPath(); c.moveTo(x + lado * r * 0.42, y - r * 0.3); c.lineTo(x + lado * r * 0.08, y - r * 0.14);
    c.strokeStyle = COLORES_JUEGO.sierraOjos; c.lineWidth = 2; c.stroke();
  }
}

// El jugador: punto blanco con brillo. El punto sólido mide exactamente RADIO_JUGADOR.
function dibujarJugador(c, x, y, color, alfa) {
  const r = CONFIG.RADIO_JUGADOR;
  c.save();
  c.globalAlpha = alfa;
  const brillo = c.createRadialGradient(x, y, 0, x, y, r * DIBUJO.BRILLO_JUGADOR);
  brillo.addColorStop(0, conAlfa(COLORES_JUEGO.jugadorBrillo, 0.6));
  brillo.addColorStop(1, conAlfa(COLORES_JUEGO.jugadorBrillo, 0));
  c.fillStyle = brillo;
  c.beginPath(); c.arc(x, y, r * DIBUJO.BRILLO_JUGADOR, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
  c.fillStyle = color; c.fill();
  c.restore();
}

// Cajita redondeada con texto (no se sale del tablero)
function pildora(c, texto, x, y, borde) {
  const tam = tamTexto(DIBUJO.TAM_PILDORAS);
  c.font = `900 ${tam}px "Nunito", ${FUENTE_EMOJI}`;
  const ancho = c.measureText(texto).width + tam * 1.4, alto = tam * 2;
  const cx = limitar(x, ancho / 2 + 6, W - ancho / 2 - 6), cy = limitar(y, alto / 2 + 6, H - alto / 2 - 6);
  c.fillStyle = conAlfa(COLORES_JUEGO.pildora, 0.9);
  rectRedondo(c, cx - ancho / 2, cy - alto / 2, ancho, alto, alto / 2);
  c.fill();
  c.lineWidth = 2; c.strokeStyle = borde; c.stroke();
  c.fillStyle = COLORES_JUEGO.texto;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(texto, cx, cy + 1);
  return { y: cy, alto };
}
// Pone una píldora cerca de un punto (abajo si cabe, si no arriba) con una flechita
function pildoraJunto(c, texto, p, separacion, color, ahora) {
  const alto = tamTexto(DIBUJO.TAM_PILDORAS) * 2;
  const abajo = p.y + separacion + alto + 10 < H;
  const salto = menosMovimiento() ? 0 : Math.sin((ahora / 1000) * 6) * 4;
  const y = abajo ? p.y + separacion + alto / 2 + salto : p.y - separacion - alto / 2 - tamTexto(DIBUJO.TAM_ETIQUETAS) - salto;
  const caja = pildora(c, texto, p.x, y, color);
  const punta = abajo ? caja.y - caja.alto / 2 - 3 : caja.y + caja.alto / 2 + 3;
  const dir = abajo ? -1 : 1;
  c.beginPath();
  c.moveTo(p.x - 8, punta); c.lineTo(p.x + 8, punta); c.lineTo(p.x, punta + dir * 10); c.closePath();
  c.fillStyle = color; c.fill();
}

function dibujarPausa(c, ahora) {
  c.fillStyle = conAlfa(COLORES_JUEGO.pausaFondo, DIBUJO.OSCURO_PAUSA);
  c.fillRect(0, 0, W, H);
  // "⏸ PAUSA" va arriba o abajo: donde quede más lejos del punto de regreso, de INICIO y de la META
  const margen = tamTexto(DIBUJO.TAM_PAUSA) * 0.85;
  const cosas = [puntoRegreso.y, inicioPx.y, metaPx.y, yEtiqueta(inicioPx), yEtiqueta(metaPx)];
  const lejania = (y) => Math.min(...cosas.map((v) => Math.abs(v - y)));
  const yPausa = lejania(margen) >= lejania(H - margen) ? margen : H - margen;
  etiqueta(c, TEXTOS.PAUSA, W / 2, yPausa, COLORES_JUEGO.texto, DIBUJO.TAM_PAUSA);
  const r = radioRegresoActual();   // con el dedo se dibuja más grande (es lo que se puede tocar)
  const latido = menosMovimiento() ? 0.5 : 0.5 + 0.5 * Math.sin((ahora / 1000) * 5);
  c.beginPath(); c.arc(puntoRegreso.x, puntoRegreso.y, r + 6 * latido, 0, Math.PI * 2);
  c.strokeStyle = conAlfa(COLORES_JUEGO.regreso, 0.5); c.lineWidth = 2; c.stroke();
  c.beginPath(); c.arc(puntoRegreso.x, puntoRegreso.y, r, 0, Math.PI * 2);
  c.fillStyle = conAlfa(COLORES_JUEGO.regreso, 0.3); c.fill();
  c.strokeStyle = COLORES_JUEGO.regreso; c.lineWidth = 3; c.stroke();
  pildoraJunto(c, esTactil() ? TEXTOS.REGRESO_TACTIL : TEXTOS.REGRESO_MOUSE, puntoRegreso, r + 10, COLORES_JUEGO.regreso, ahora);
}

// Ayuda para el dueño: cuadrícula, coordenadas, línea central y problemas del nivel
function dibujarGuia(c) {
  c.save();
  c.strokeStyle = conAlfa(COLORES_JUEGO.guia, 0.18);
  c.lineWidth = 1;
  c.beginPath();
  for (let x = 0; x <= W; x += CELDA) { c.moveTo(x, 0); c.lineTo(x, H); }
  for (let y = 0; y <= H; y += CELDA) { c.moveTo(0, y); c.lineTo(W, y); }
  c.stroke();
  c.font = '10px sans-serif';
  c.fillStyle = conAlfa(COLORES_JUEGO.guia, 0.55);
  c.textAlign = 'left'; c.textBaseline = 'top';
  for (let i = 0; i < W / CELDA; i++) {
    for (let j = 0; j < H / CELDA; j++) c.fillText(vertical ? `${j},${i}` : `${i},${j}`, i * CELDA + 3, j * CELDA + 3);
  }
  c.setLineDash([6, 6]);
  c.strokeStyle = COLORES_JUEGO.guiaLinea; c.lineWidth = 2;
  trazarPolilinea(c); c.stroke();
  c.setLineDash([]);
  c.font = 'bold 12px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  polilinea.forEach((p, i) => {
    c.beginPath(); c.arc(p.x, p.y, 9, 0, Math.PI * 2); c.fillStyle = COLORES_JUEGO.guiaLinea; c.fill();
    c.fillStyle = '#000000'; c.fillText(String(i + 1), p.x, p.y);
  });
  c.restore();
}
// Los avisos de la guía (velocidad y problemas) se dibujan al final, encima de todo
function dibujarAvisosGuia(c) {
  c.save();
  const MAX = 5;   // cuántos problemas se escriben en el tablero (todos salen en la consola)
  const lineas = [`Velocidad necesaria: ${Math.round(revision.velocidad)} px/s (con sierras: ${Math.round(revision.velocidadConObstaculos)})`]
    .concat(revision.problemas.slice(0, MAX).map((t) => '⚠ ' + t));
  if (revision.problemas.length > MAX) lineas.push(TEXTOS.GUIA_MAS(revision.problemas.length - MAX));
  c.font = 'bold 13px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top';
  lineas.forEach((t, i) => {
    c.fillStyle = 'rgba(0, 0, 0, 0.75)';
    c.fillRect(4, 4 + i * 18, c.measureText(t).width + 8, 17);
    c.fillStyle = i === 0 ? '#ffffff' : COLORES_JUEGO.guiaLinea;
    c.fillText(t, 8, 6 + i * 18);
  });
  c.restore();
}

function rectRedondo(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// ---------- Partículas: confeti (al ganar) y chispas (al chocar) ----------
// "encima" = true: se dibuja en la capa de arriba (encima de la pantalla de fin)
function lanzarParticulas(x, y, cantidad, colores, tipo, fuerza, encima = false) {
  if (menosMovimiento()) return;   // quien pidió menos animaciones no ve partículas volando
  for (let i = 0; i < cantidad; i++) {
    const ang = Math.random() * Math.PI * 2, vel = fuerza * (0.35 + Math.random() * 0.65);
    particulas.push({
      x, y, tipo, encima,
      vx: Math.cos(ang) * vel,
      vy: Math.sin(ang) * vel - (tipo === 'confeti' ? fuerza * 0.6 : 0),
      vida: 0,
      max: 0.7 + Math.random() * (tipo === 'confeti' ? 1.1 : 0.4),
      color: colores[i % colores.length],
      tam: tipo === 'confeti' ? 5 + Math.random() * 5 : 2 + Math.random() * 3,
      giro: Math.random() * Math.PI, vgiro: (Math.random() - 0.5) * 14,
    });
  }
}
const lanzarConfeti = (x, y, encima) => lanzarParticulas(x, y, DIBUJO.CONFETI_CANTIDAD, COLORES_JUEGO.confeti, 'confeti', DIBUJO.FUERZA_CONFETI, encima);
const lanzarChispas = (x, y) => lanzarParticulas(x, y, DIBUJO.CHISPAS_CANTIDAD, COLORES_JUEGO.chispas, 'chispa', DIBUJO.FUERZA_CHISPAS);

function actualizarParticulas(dt) {
  for (const p of particulas) {
    p.vida += dt;
    p.vy += DIBUJO.GRAVEDAD * dt * (p.tipo === 'confeti' ? 0.6 : 1);
    p.vx *= 1 - 1.5 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.giro += p.vgiro * dt;
  }
  particulas = particulas.filter((p) => p.vida < p.max);
}
function dibujarParticulas(c, lista) {
  for (const p of lista) {
    c.globalAlpha = 1 - p.vida / p.max;
    c.fillStyle = p.color;
    if (p.tipo === 'confeti') {
      c.save(); c.translate(p.x, p.y); c.rotate(p.giro);
      c.fillRect(-p.tam / 2, -p.tam / 4, p.tam, p.tam / 2);
      c.restore();
    } else {
      c.beginPath(); c.arc(p.x, p.y, p.tam, 0, Math.PI * 2); c.fill();
    }
  }
  c.globalAlpha = 1;
}

// Capa de arriba (encima de la pantalla de fin): sólo trabaja mientras hay confeti "encima"
let fiestaSucia = false;
function dibujarFiesta() {
  const encima = particulas.filter((p) => p.encima);
  if (!encima.length && !fiestaSucia) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const ancho = Math.round(window.innerWidth * dpr), alto = Math.round(window.innerHeight * dpr);
  if (capaFiesta.width !== ancho) capaFiesta.width = ancho;
  if (capaFiesta.height !== alto) capaFiesta.height = alto;
  ctxFiesta.setTransform(1, 0, 0, 1, 0, 0);
  ctxFiesta.clearRect(0, 0, ancho, alto);
  fiestaSucia = encima.length > 0;
  if (!fiestaSucia) return;
  // Mismas coordenadas que el tablero, pero el confeti puede salir volando fuera de él
  const r = lienzo.getBoundingClientRect();
  ctxFiesta.setTransform((dpr * r.width) / W, 0, 0, (dpr * r.height) / H, dpr * r.left, dpr * r.top);
  dibujarParticulas(ctxFiesta, encima);
}

// Dibuja todo el tablero (se llama en cada cuadro)
function dibujar(ahora) {
  const c = ctx;
  c.setTransform(lienzo.width / W, 0, 0, lienzo.height / H, 0, 0);
  c.clearRect(0, 0, W, H);
  if (!datosNivel) return;
  // 💡 IDEA: niveles que giran: aquí hacer c.translate(W/2, H/2); c.rotate(angulo); c.translate(-W/2, -H/2)
  //          y en aLogico() aplicar la rotación al revés, para que el choque siga siendo exacto.
  // 1) Paredes (y se ponen rojas mientras se cierran)
  if (fondoParedes) c.drawImage(fondoParedes, 0, 0, W, H);
  const peligro = 1 - fraccionUtil();
  if (peligro > 0) {
    c.globalAlpha = peligro * DIBUJO.TINTE_PELIGRO;
    c.fillStyle = COLORES_JUEGO.paredPeligro;
    c.fillRect(0, 0, W, H);
    c.globalAlpha = 1;
  }
  // 2) Pasillo, INICIO, META, sierras y partículas
  dibujarPasillo(c, ahora);
  if (CONFIG.MOSTRAR_GUIA) dibujarGuia(c);
  dibujarInicio(c, ahora);
  dibujarMeta(c);
  obstaculosAhora.forEach((o) => dibujarSierra(c, o, ahora));
  dibujarParticulas(c, particulas.filter((p) => !p.encima));
  // 3) Mensajes y jugador según el estado
  if (estado === 'esperando') {
    pildoraJunto(c, esTactil() ? TEXTOS.PISTA_TACTIL : TEXTOS.PISTA_MOUSE, inicioPx, CONFIG.RADIO_INICIO_META + 8, COLORES_JUEGO.inicio, ahora);
  }
  if (estado === 'pausa') dibujarPausa(c, ahora);
  if (estado === 'golpe' && puntoGolpe) dibujarJugador(c, puntoGolpe.x, puntoGolpe.y, COLORES_JUEGO.bordePeligro, 1);
  else if (estado === 'nivelSuperado' && ultimaPos) dibujarJugador(c, ultimaPos.x, ultimaPos.y, COLORES_JUEGO.jugador, 1);
  else if (['esperando', 'jugando', 'pausa'].includes(estado) && puntero.visible) {
    const enJuego = estado === 'jugando' && ultimaPos;
    dibujarJugador(c, enJuego ? ultimaPos.x : puntero.x, enJuego ? ultimaPos.y : puntero.y, COLORES_JUEGO.jugador, estado === 'pausa' ? 0.5 : 1);
  }
  // 4) Avisos de la guía para el dueño, encima de todo
  if (CONFIG.MOSTRAR_GUIA) dibujarAvisosGuia(c);
}


/* =====================================================================
   BUCLE PRINCIPAL (unas 60 veces por segundo)
   ===================================================================== */
let ultimoCuadro = performance.now();
function bucle(ahora) {
  requestAnimationFrame(bucle);
  const dt = limitar((ahora - ultimoCuadro) / 1000, 0, 0.1);   // si el celular se traba, no salta de golpe
  ultimoCuadro = ahora;
  if (estado === 'jugando') avanzarJuego(dt, ahora);
  actualizarParticulas(dt);
  dibujar(ahora);
  dibujarFiesta();
  actualizarHud();
}


/* =====================================================================
   ARRANQUE
   ===================================================================== */
function ponerTextos() {
  document.title = TEXTOS.TITULO.replace(/^\P{L}+/u, '');
  $('titulo').textContent = TEXTOS.TITULO;
  $('tituloCompacto').textContent = TEXTOS.TITULO;   // el mismo título, dentro de la tarjeta (celular acostado)
  $('subtitulo').textContent = TEXTOS.SUBTITULO;
  $('textoAtajos').textContent = TEXTOS.ATAJOS;
  $('btnSonido').title = TEXTOS.SONIDO_AYUDA;
  $('inicioTitulo').textContent = TEXTOS.INICIO_TITULO;
  $('instrucciones').innerHTML = TEXTOS.INSTRUCCIONES.map((t) => `<li>${t}</li>`).join('');
  $('btnJugar').textContent = TEXTOS.BOTON_JUGAR;
  $('btnSiguiente').textContent = TEXTOS.BOTON_SIGUIENTE;
  $('btnOtra').textContent = TEXTOS.BOTON_OTRA;
  $('btnCompartir').textContent = TEXTOS.BOTON_COMPARTIR;
  $('btnInicio').textContent = TEXTOS.BOTON_INICIO;
  $('finRecord').textContent = TEXTOS.NUEVO_RECORD;
  $('finRangoEtiqueta').textContent = TEXTOS.RANGO_ETIQUETA;
  $('hudPasilloTexto').textContent = TEXTOS.HUD_PASILLO;
  lienzo.setAttribute('aria-label', TEXTOS.ARIA_LIENZO);
  actualizarBotonesSonido();
  actualizarTextoRecord();
}

// Los eventos se conectan UNA sola vez (no se duplican al reiniciar)
function conectarEventos() {
  lienzo.addEventListener('pointermove', alMoverPuntero);
  lienzo.addEventListener('pointerdown', alBajarPuntero);
  lienzo.addEventListener('pointerup', alSoltarPuntero);
  lienzo.addEventListener('pointercancel', alSoltarPuntero);
  lienzo.addEventListener('pointerleave', alSalirPuntero);
  lienzo.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('blur', pausar);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pausar(); });
  window.addEventListener('resize', alCambiarTamano);
  if (window.ResizeObserver) new ResizeObserver(alCambiarTamano).observe(elZona);
  // El sonido sólo puede empezar después de un clic o toque
  document.addEventListener('pointerdown', alTocarPagina, true);
  document.addEventListener('keydown', prepararAudio, true);
  document.addEventListener('keydown', alPresionarTecla);
  $('btnJugar').addEventListener('click', nuevaPartida);
  $('btnSiguiente').addEventListener('click', siguienteNivel);
  $('btnOtra').addEventListener('click', nuevaPartida);
  $('btnCompartir').addEventListener('click', compartir);
  $('btnInicio').addEventListener('click', irAlInicio);
  $('btnSonido').addEventListener('click', alternarSonido);
  $('btnSonidoInicio').addEventListener('click', alternarSonido);
}

// ?nivel=N en la dirección: empieza directo en ese nivel
function nivelDeLaDireccion() {
  try {
    const n = parseInt(new URLSearchParams(location.search).get('nivel'), 10);
    if (!Number.isFinite(n) || n < 1) return null;
    return CONFIG.MODO_INFINITO ? n : Math.min(n, NIVELES.length);
  } catch { return null; }
}

/* Ayudante PARA PRUEBAS; se puede borrar. Permite que un programa de pruebas
   lea el estado del juego (no cambia nada del juego). */
window.juegoDebug = {
  estado: () => estado,
  nivel: () => nivelActual,
  vidas: () => vidas,
  puntos: () => puntos,
  medioAncho: () => medioAncho,
  polilinea: () => polilinea.map((p) => ({ x: p.x, y: p.y })),
  inicio: () => ({ x: inicioPx.x, y: inicioPx.y, r: CONFIG.RADIO_INICIO_META }),
  meta: () => ({ x: metaPx.x, y: metaPx.y, r: CONFIG.RADIO_INICIO_META }),
  obstaculos: () => obstaculosAhora.map((o) => ({ x: o.x, y: o.y, r: o.r })),
  tamanoLogico: () => ({ w: W, h: H }),
  aPantalla: (x, y) => {
    const r = lienzo.getBoundingClientRect();
    return { x: r.left + (x * r.width) / W, y: r.top + (y * r.height) / H };
  },
};

function arrancar() {
  ponerTextos();
  conectarEventos();
  const n = nivelDeLaDireccion();
  if (n) {
    nivelDePartida = n;
    empezarPartida(n);
  } else {
    prepararNivel(1);
    mostrarPantalla('pantallaInicio');
  }
  requestAnimationFrame((t) => { ultimoCuadro = t; bucle(t); });
}
arrancar();
